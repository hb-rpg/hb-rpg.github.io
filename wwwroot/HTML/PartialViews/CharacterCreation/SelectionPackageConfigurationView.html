
<!-- explanation: longer context shown before choices (e.g. rule reference) -->
<!-- ko if: explanation -->
<div class="big-padding" data-bind="PartialView: explanation"></div>
<!-- /ko -->

<!-- choices: fixed grants and player-selectable pickers -->
<!-- ko if: fixedChoices().length == 0 && selectableChoices().length == 0 -->
    <div>Nothing to select.</div>
<!-- /ko -->

<!-- ko ifnot: fixedChoices().length == 0 && selectableChoices().length == 0 -->
    <div class="vertically-stacked-widgets">
        <!-- ko foreach: fixedChoices -->

        <div class="hoverable-container vertically-stacked-widget-children choice-container">
            <h4 class="title" data-bind="text: $data.Title"></h4>
            <div data-bind="text: $data.Description"></div>
        </div>

        <!-- /ko -->

        <!-- ko foreach: selectableChoices -->

        <div class="hoverable-container vertically-stacked-widget-children choice-container">
            <div data-bind="PartialView: $data"></div>
        </div>
        <!-- /ko -->
    </div>

    <!-- ko if: selectableChoices().length > 0 -->
    <div class="centered">
        <button class="wizard-button pop-content" data-bind="click: ChoiceRandomly">Choose Randomly</button>
    </div>
    <!-- /ko -->

<!-- /ko -->


<!-- qualifier: short notice shown after choices -->
<!-- ko if: qualifier -->
<div class="small-gap standard-padding centered" data-bind="PartialView: qualifier"></div>
<!-- /ko -->

<!-- error: validation feedback -->
<div class="error-message" data-bind="visible: errorMessage, text: errorMessage"></div>
