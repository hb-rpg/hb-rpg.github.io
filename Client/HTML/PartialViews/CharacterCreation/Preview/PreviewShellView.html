<!-- ko if: IsConfigured -->
<div class="step-preview">
    <div class="step-preview-header">
        <div class="bold-text">
            <span>Step</span> <span data-bind="text: StepNumber"></span>
        </div>

        <div data-bind="text: FriendlyName"></div>

        <div class="small-gap remove-when-print">
            <button class="pop-content button-icon centered" title="Edit this step" aria-label="Edit this step" data-bind="click: Edit">
                <img src="/Images/CharacterCreator/edit-button-svgrepo-com.svg" alt="Edit"/>
            </button>
            <button class="pop-content button-icon centered" title="Randomize this step" aria-label="Randomize this step" data-bind="click: Randomize">
                <img src="/Images/dice-icon.svg" alt="Randomize"/>
            </button>
        </div>
    </div>

    <div class="step-preview-content" data-bind="PartialView: contentViewModel"></div>
</div>
<!-- /ko -->

<!-- ko ifnot: IsConfigured -->
<div class="step-actions remove-when-print">
    <div class="section-buttons large-gap">
        <div class="bold-text">
            <span>Step</span> <span data-bind="text: StepNumber"></span>
        </div>

        <button class="pop-content wizard-button" data-bind="click: Edit">
            <span>Select </span>
            <span data-bind="text: FriendlyName"></span>
        </button>

        <button class="pop-content wizard-button" data-bind="click: Randomize">
            <span>Roll </span>
            <span data-bind="text: FriendlyName"></span>
        </button>
    </div>
</div>
<!-- /ko -->
