<div class="propensity-view standard-wizard-styles">
    <div class="image-container">
        <img class="image" data-bind="attr: {src: PictureUrl}">
        <div class="description largeText" data-bind="text: RaceDescription"></div>
    </div>

    <div class="centered hoverable-container big-padding">
        <div class="bold-text">Race</div>
        <select class="wizard-select pop-content" data-bind="options: PossibleRaces, optionsCaption: 'Choose', value: ChosenRace"></select>
    </div>
    
    <div class="error-message" data-bind="visible: errorMessage, text: errorMessage"></div>
</div>
