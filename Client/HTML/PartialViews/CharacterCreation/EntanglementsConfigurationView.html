<div class="AbilityView">
    <div class="image-container">
        <img class="medium-sized-image image" data-bind="attr: {src: PictureUrl}">
        <div class="description largeText" data-bind="text: EntanglementDescription"></div>
    </div>

    <hr>

    <div class="section-buttons boolean-button small-gap">
        <div class="padded-centered-text hoverable-container">
            <div>
                Entanglement Rolls
            </div>
            <div class="bold-text small-gap">
                <!-- ko foreach: PossibleAttitudes -->
                    <span data-bind="text: $data"></span>
                <!-- /ko -->
            </div>
        </div>
    </div>

    

    <div>
        <div class="ability-pickers" data-bind="foreach: OrganizationTypes"> 
            <div class="hoverable-container" data-bind="PartialView: $parent.Pickers[$data]"></div>
        </div>
    </div>

    <div class="centered">
        <button class="hoverable-container wizard-button" data-bind="click: chooseRandomly"> Randomly Assign Entanglements </button>
    </div>

    <div>Note: Some entanglement slots may be pre-selected based on your background.</div>

    <div class="error-message" data-bind="visible: errorMessage, text: errorMessage"></div>

</div>
